<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f5ecd7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1b140e" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the saved theme before first paint (no flash of daylight at midnight).
			try {
				var s = JSON.parse(localStorage.getItem('cuescript:settings') || '{}');
				if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
